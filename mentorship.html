<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Mentorship - NFX Trading</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#05070b}
.meeting{padding:40px 4%;max-width:1500px;margin:auto}
.meeting h1{margin-bottom:8px}
.status{color:#9ba6b5;margin-bottom:20px}
.room{width:100%;height:72vh;min-height:500px;border:1px solid #252d39;border-radius:16px;overflow:hidden;background:#10151d;margin-top:18px}
</style>
</head>
<body>
<header><b>NFX TRADING</b><a href="dashboard.html">Dashboard</a></header>

<main class="meeting">
<p class="eyebrow">LIVE MENTORSHIP</p>
<h1>Live Mentorship</h1>
<p class="status" id="status">Connecting to live meeting...</p>
<div id="meeting" class="room"></div>
</main>

<script src="https://meet.jit.si/external_api.js"></script>
<script>
const api = new JitsiMeetExternalAPI('meet.jit.si', {
  roomName: 'NFXTradingMentorshipDemo2026',
  parentNode: document.querySelector('#meeting'),
  width: '100%',
  height: '100%',
  userInfo: {displayName:'NFX Trading Member'},
  configOverwrite: {
    prejoinConfig: {enabled:true}
  },
  interfaceConfigOverwrite: {
    MOBILE_APP_PROMO: false,
    SHOW_JITSI_WATERMARK: false,
    SHOW_WATERMARK_FOR_GUESTS: false,
    SHOW_BRAND_WATERMARK: false,
    SHOW_POWERED_BY: false,
    TILE_VIEW_MAX_COLUMNS: 4
  }
});
api.addEventListener('videoConferenceJoined', function(){
  document.getElementById('status').textContent = 'Connected. Camera, microphone, chat and screen sharing are available.';
});
</script>
</body>
</html>
